
<!DOCTYPE html>
<html>
<head>
    <title>Change Background Colour</title>
</head>
<body>

<h2>Change Background Colour</h2>

<button ondblclick="document.body.style.backgroundColor='green'">
    Double Click
</button>

<button onclick="document.body.style.backgroundColor='blue'">
    Single Click
</button>

</body>
</html>
