
<!DOCTYPE html>
<html>
<head>
    <title>Change Background Colour</title>
</head>

<body>

    <h2>Change Background Colour</h2>

    <button id="single">Single Click - Green</button>
    <button id="double">Double Click - Yellow</button>

    <script>
        document.getElementById("single").addEventListener("click", function() {
            document.body.style.backgroundColor = "green";
        });

        document.getElementById("double").addEventListener("dblclick", function() {
            document.body.style.backgroundColor = "yellow";
        });
    </script>

</body>
</html>
